{% macro animal_card(animal, n) -%}

<span># {{ n }} </span>
 <a href="/animals/{{n}}">
<div class="card">
  <div class="card-image">
    <figure class="image is-128x128">

      <img
        src="{{ animal.image_url }}"
        alt="{{ animal.name }}" width="160"
      />

    </figure>
  </div>
  <div class="card-content">
    <div class="media">
      <div class="media-left">
        <figure class="image is-48x48">
          <img
            src="{{ animal.image_url }}"
        alt="{{ animal.name }}"
          />
        </figure>
      </div>
      <div class="media-content">
        <p class="title is-4">{{ animal.name }}</p>

      </div>
    </div>

    <div class="content">
      <br />
      <p class="title is-4">Raza: {{ animal.breed.value }}</p>
      <time datetime="2016-1-1">{{ animal.birth_day }}</time>
    </div>
  </div>
</div>
   </a>
{%- endmacro %}
