{% extends "base.html" %}

{% block content %}
<h1>Productos</h1>
<div>
  <section>
    <h2>Disponibles</h2>
{% for product in products %}
    <h3>Producto</h3> {{ product.name }}
    <img src="{{ product.image_url }}" alt="Foto de {{ product.name }}" width="80">
{% endfor %}
  </section>

    <a href="/products/new">Adicionar un producto</a>

</div>

{% endblock %}
