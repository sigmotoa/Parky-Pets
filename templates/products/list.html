{% extends "base.html" %}

{% block content %}
<h1 class="title">Productos</h1>

<div>
  <section>
      <a class="button is-primary" href="/products/new">
<span class="icon">
<i class="fas fa-user"></i>
</span>
<span>Add a product</span>
</a>
    <h2 class="title">Disponibles</h2>
{% for product in products %}
    <h3>Producto</h3> {{ product.name }}

      <figure class="image is-128x128">
  <img class="is-rounded" src="{{ product.image_url }}" alt="Foto de {{ product.name }}"/>
</figure>
    <p>{{product.expiration_date}}</p>


{% endfor %}
  </section>

    <a href="/products/new">Adicionar un producto</a>

</div>

{% endblock %}
