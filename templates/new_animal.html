{% extends "base.html" %}

{% block content %}
<form method="post" action="/animals/" enctype="multipart/form-data">

<div class="field">
  <label class="label">Dog Name</label>
  <div class="control">
    <input name="name" class="input" type="text" placeholder="Dog name here" required>
  </div>
</div>

<div class="field">
  <label class="label">Species</label>
  <div class="control has-icons-left has-icons-right">
    <input class="input is-success" type="text" placeholder="Type the specie" required name="species">
    <span class="icon is-small is-left">
      <i class="fas fa-user"></i>
    </span>
    <span class="icon is-small is-right">
      <i class="fas fa-check"></i>
    </span>
  </div>
  <p class="help is-success">Nice Specie</p>
</div>

  <div class="field">
  <label class="label">Breed</label>
  <div class="control">
    <div class="select">
      <select name="breed">
        <option>Select a breed</option>
        {% for breed in breeds %}
        <option>{{ breed }}</option>
        {% endfor %}
      </select>
    </div>
  </div>
</div>
<div class="file is-boxed">
  <label class="file-label">
    <input class="file-input" type="file" name="image" />
    <span class="file-cta">
      <span class="file-icon">
        <i class="fas fa-upload"></i>
      </span>
      <span class="file-label"> Choose a file… </span>
    </span>
  </label>
</div>


<div class="field">
  <label class="label">Birthday</label>
  <div class="control has-icons-left has-icons-right">
    <input class="input is-danger" type="date" placeholder="Brith date" name="birth_day">
    <span class="icon is-small is-left">
      <i class="fas fa-envelope"></i>
    </span>
    <span class="icon is-small is-right">
      <i class="fas fa-exclamation-triangle"></i>
    </span>
  </div>
  <p class="help is-danger">This email is invalid</p>
</div>

<div class="field">
  <label class="label">Gender</label>
  <div class="control">
    <div class="select">
      <select name="gender">
        <option>Select a gender</option>
        {% for gender in genders %}
        <option>{{ gender }}</option>
        {% endfor %}
      </select>
    </div>
  </div>
</div>



<div class="field">
  <label class="label">Status</label>
  <div class="control">
    <div class="select">
      <select name="status">
        <option>Select a status</option>
        {% for statu in status %}
        <option>{{ statu }}</option>
        {% endfor %}
      </select>
    </div>
  </div>
</div>







<div class="field is-grouped">
  <div class="control">
    <button class="button is-link" type="submit">Save DOG</button>
  </div>
  <div class="control">
    <button class="button is-link is-light">Cancel</button>
  </div>
</div>


</form>


{% endblock %}
