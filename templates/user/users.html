{% extends "base.html" %}

{% block content %}

<h1 class="title">Usuarios de {{ app_name }}</h1>

<p>Tenemos {{users|length}} usuarios registrados</p>
<a class="button is-primary" href="/users/new">
<span class="icon">
<i class="fas fa-user"></i>
</span>
<span>Add a user</span>
</a>
<hr>
{% for user in users %}

<h3 class="author-decor">{{ user.first_name }}</h3>
<figure class="image is-128x128">
  <img class="is-rounded" src="{{ user.image_url }}" width="128" height="128"/>
</figure>
<hr>
{% endfor %}
{% endblock %}
