{% extends "base.html" %}
{% from "users/user.html" import user_card %}

{% block content %}

<h1 class="title">Usuarios de {{ app_name }}</h1>

<p>Tenemos {{users|length}} usuarios registrados</p>
<a class="button is-primary" href="/users/new">
<span class="icon">
<i class="fas fa-user"></i>
</span>
<span>Add a user</span>
</a>
<hr>
{% for user in users %}
{{ user_card(user, loop.index) }}

<hr>
{% endfor %}
{% endblock %}
